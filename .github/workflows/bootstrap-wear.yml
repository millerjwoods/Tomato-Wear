name: Build Tomato Wear OS APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 36 using runner SDK
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build Wear OS debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tomato-wear-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
